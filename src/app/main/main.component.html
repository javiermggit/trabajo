
<div class="flex flex-column align-items-center justify-content-center">
  <!-- <img src="" alt="Logo Everest" class="mb-5 w-6rem flex-shrink-0"> -->
  <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, rgba(0, 29, 196, 0.4) 10%, rgba(57, 54, 255, 0) 30%);">
      <div class="w-full surface-card py-8 px-5 sm:px-8 flex flex-column align-items-center" style="border-radius:53px">
          <div class="grid flex flex-column align-items-center">
              <div class="flex justify-content-center align-items-center bg-primary-500 border-circle" style="width:3.2rem; height:3.2rem;">
                  <i *ngIf="!redirectionComplete" class="text-50 pi pi-spin pi-spinner text-2xl"></i>
                  <i *ngIf="redirectionComplete" class="text-50 ri-check-line text-3xl"></i>
              </div>
              <h1 class="text-900 font-bold text-3xl lg:text-4xl mb-3">
                {{title}}
              </h1>
              <span class="text-600 mb-5" *ngIf="!redirectionComplete">Lo estamos redirigiendo al módulo solicitado, espere un momento por favor.</span>
              <span class="text-600 mb-5" *ngIf="redirectionComplete">
                Lo hemos redirigido al módulo {{ routeData?.path }}.
              </span>
              <!-- <img src="" alt="img" class="mb-5" width="80%"> -->
              <button pButton pRipple icon="ri-external-link-line" label="Abrir módulo" class="p-button-text mb-2" (click)="focusOnNewWindow()" *ngIf="redirectionComplete"></button>
              <button pButton pRipple icon="pi pi-arrow-left" label="Ir al inicio" class="p-button-text"  *ngIf="redirectionComplete"></button>
          </div>
      </div>
  </div>
</div>
